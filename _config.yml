title: Arawn Davies
description: The melting pot of software, hardware and experience
author: Arawn Davies
url: https://arawn-davies.co.uk

theme: just-the-docs

plugins:
  - jekyll-feed

include:
  - _pages

# just-the-docs settings
color_scheme: dark
search_enabled: true
heading_anchors: true

aux_links:
  GitHub: https://github.com/Arawn-Davies
aux_links_new_tab: true

footer_content: 'Arawn Davies &middot; <a href="mailto:arawn@arawn-davies.co.uk">arawn@arawn-davies.co.uk</a>'

# Keep legacy/section pages out of the main nav to avoid clutter
defaults:
  - scope: { path: "_pages" }
    values: { nav_exclude: true }

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
